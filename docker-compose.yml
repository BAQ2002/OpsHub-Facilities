services:
  postgres:
    image: postgres:16-alpine
    container_name: opshub-facilities-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opshub_facilities}
      POSTGRES_USER: ${POSTGRES_USER:-opshub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opshub_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opshub} -d ${POSTGRES_DB:-opshub_facilities}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
