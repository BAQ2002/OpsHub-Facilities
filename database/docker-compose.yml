services:
  api:
    image: python:3.13-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opshub}:${POSTGRES_PASSWORD:-opshub_dev_password}@postgres:5432/${POSTGRES_DB:-opshub_facilities}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: opshub-facilities-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opshub_facilities}
      POSTGRES_USER: ${POSTGRES_USER:-opshub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opshub_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opshub} -d ${POSTGRES_DB:-opshub_facilities}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
